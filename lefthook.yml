pre-commit:
  commands:
    gitleaks:
      run: gitleaks protect --staged --redact --verbose
    type-check:
      run: npx tsc --noEmit
    eslint:
      glob: '{app,components,lib,layouts,scripts}/**/*.{js,jsx,ts,tsx}'
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    prettier:
      glob: '*.{js,jsx,ts,tsx,json,css,md,mdx}'
      run: npx prettier --write {staged_files}
      stage_fixed: true
